name: KeeperFX Vita Network Probe 2 CI

on:
  push:
    branches: [ "keeperfx-vita-network-build2" ]
  workflow_dispatch:

jobs:
  build-vita-network:
    name: Build KeeperFX PS Vita IPv4 LAN networking probe
    runs-on: ubuntu-24.04
    container:
      image: ghcr.io/cerwym/build-vitasdk:latest
      options: --user root

    steps:
      - name: Checkout Vita network helpers
        uses: actions/checkout@v4
        with:
          ref: keeperfx-vita-network-probe
          path: ci

      - name: Checkout KeeperFX known-good Vita commit
        uses: actions/checkout@v4
        with:
          repository: cerwym/keeperfx
          ref: 466e0753e17cee876f2ace6fa6b1e17f3ad44b0d
          fetch-depth: 1
          submodules: recursive
          path: keeperfx

      - name: Mark git directory safe
        run: git config --global --add safe.directory '*'

      - name: Install Vita v5-v14 chain and network probe
        working-directory: keeperfx
        shell: bash
        run: |
          set -e
          cp ../ci/keeperfx-vita/input_vita_touch.c src/input/input_vita.c
          cp ../ci/keeperfx-vita/WindowSystemVita_touch.cpp src/platform/WindowSystemVita.cpp
          python3 - <<'PY'
          from pathlib import Path
          p=Path('src/platform/WindowSystemVita.cpp'); s=p.read_text(); s=s.replace('lbMouse.MMouseX','lbDisplay.MMouseX').replace('lbMouse.MMouseY','lbDisplay.MMouseY'); p.write_text(s)
          PY
          cp ../ci/keeperfx-vita/vita_bootstrap.hpp src/platform/vita_bootstrap.hpp
          python3 ../ci/keeperfx-vita/patch_bootstrap.py
          base64 -d ../ci/keeperfx-vita/v5_runtime.patch.gz.b64 | gzip -d > /tmp/v5.patch
          patch -p1 < /tmp/v5.patch
          python3 ../ci/keeperfx-vita/patch_v6_runtime.py
          python3 ../ci/keeperfx-vita/patch_v6_compilefix.py
          sed -i 's/loader_draw_progress(unsigned long done, unsigned long total)/loader_draw_progress(unsigned long done, unsigned long total, const char *status)/g' ../ci/keeperfx-vita/patch_v7_runtime.py
          python3 ../ci/keeperfx-vita/patch_v7_runtime.py
          python3 ../ci/keeperfx-vita/patch_v7_compilefix.py
          python3 ../ci/keeperfx-vita/patch_v8_preflight.py
          python3 ../ci/keeperfx-vita/patch_v8b_safety.py
          python3 ../ci/keeperfx-vita/patch_v8c_loader_shutdown.py
          python3 ../ci/keeperfx-vita/patch_v8d_software_ui.py
          python3 ../ci/keeperfx-vita/patch_v9_ux_controls.py
          base64 -d ../ci/keeperfx-vita/patch_v10_hardware_input_audio_progress.py.gz.b64 | gzip -d > /tmp/v10.py
          python3 /tmp/v10.py
          sed -i '/static int16_t[[:space:]]*s_music_buf\[MUSIC_GRAIN \* 2\]; \/\* stereo \*\//d' src/audio/audio_vita.c
          cp ../ci/keeperfx-vita/patch_v11_vita_controls.py /tmp/v11.py
          python3 - <<'PY'
          from pathlib import Path
          p=Path('/tmp/v11.py'); s=p.read_text()
          old="if include_anchor in s and '#include <math.h>\\n' not in s:\n    s = s.replace(include_anchor, '#include <math.h>\\n' + include_anchor, 1)\ns = s[:idx] + helper + s[idx:]"
          new="if include_anchor in s and '#include <math.h>\\n' not in s:\n    s = s.replace(include_anchor, '#include <math.h>\\n' + include_anchor, 1)\nidx = s.find(anchor)\nif idx < 0:\n    raise SystemExit('v11 patch: controller axis function moved unexpectedly')\ns = s[:idx] + helper + s[idx:]"
          if old not in s: raise SystemExit('v11 helper offset fix missing')
          p.write_text(s.replace(old,new,1))
          PY
          python3 /tmp/v11.py
          python3 - <<'PY'
          from pathlib import Path
          p=Path('src/input/input_vita.c'); s=p.read_text(); a='static float vita_camera_axis(int raw)\n'; d='static int touch_x_to_screen(int raw_x);\nstatic int touch_y_to_screen(int raw_y);\n\n'
          if 'static int touch_x_to_screen(int raw_x);' not in s: s=s.replace(a,d+a,1)
          p.write_text(s)
          for n in ('src/front_input.c','src/front_landview.c'):
              p=Path(n); s=p.read_text(); p.write_text(s if '#include <math.h>' in s else '#include <math.h>\n'+s)
          PY
          python3 ../ci/keeperfx-vita/patch_v12_ingame_blockers_perf.py
          python3 ../ci/keeperfx-vita/patch_v12b_affinity_order.py
          python3 ../ci/keeperfx-vita/patch_v13_diagnostics.py
          python3 ../ci/keeperfx-vita/patch_v14_local_packet_history.py
          python3 ../ci/keeperfx-vita/patch_network_probe.py

      - name: Build IPv4-only ENet6 for Vita
        shell: bash
        run: |
          set -euxo pipefail
          rm -rf /tmp/enet6 /tmp/enet6-obj
          git clone --depth 1 https://github.com/SirLynix/enet6.git /tmp/enet6
          python3 - <<'PY'
          from pathlib import Path
          p=Path('/tmp/enet6/src/unix.c'); s=p.read_text()
          s=s.replace('#include <sys/ioctl.h>\n','#ifndef __vita__\n#include <sys/ioctl.h>\n#endif\n',1)
          old='''        case ENET_SOCKOPT_NONBLOCK:\n#ifdef HAS_FCNTL\n            result = fcntl (socket, F_SETFL, (value ? O_NONBLOCK : 0) | (fcntl (socket, F_GETFL) & ~O_NONBLOCK));\n#else\n            result = ioctl (socket, FIONBIO, & value);\n#endif\n            break;\n'''
          new='''        case ENET_SOCKOPT_NONBLOCK:\n#ifdef __vita__\n            result = setsockopt(socket, SOL_SOCKET, SO_NONBLOCK, (char *)&value, sizeof(value));\n#elif defined(HAS_FCNTL)\n            result = fcntl (socket, F_SETFL, (value ? O_NONBLOCK : 0) | (fcntl (socket, F_GETFL) & ~O_NONBLOCK));\n#else\n            result = ioctl (socket, FIONBIO, & value);\n#endif\n            break;\n'''
          if old not in s: raise SystemExit('nonblock anchor missing')
          s=s.replace(old,new,1)
          s=s.replace('return listen (socket, backlog < 0 ? SOMAXCONN : backlog);','return listen (socket, backlog < 0 ? 16 : backlog);',1)
          old='''        case ENET_SOCKOPT_IPV6ONLY:\n            result = setsockopt(socket, IPPROTO_IPV6, IPV6_V6ONLY, (char *) & value, sizeof(int));\n            break;\n'''
          new='''        case ENET_SOCKOPT_IPV6ONLY:\n#ifdef __vita__\n            result = -1;\n#else\n            result = setsockopt(socket, IPPROTO_IPV6, IPV6_V6ONLY, (char *) & value, sizeof(int));\n#endif\n            break;\n'''
          if old not in s: raise SystemExit('ipv6 option anchor missing')
          s=s.replace(old,new,1)
          old='''ENetSocket\nenet_socket_create (ENetAddressType addressType, ENetSocketType socketType)\n{\n    return socket(addressType == ENET_ADDRESS_TYPE_IPV4 ? PF_INET : PF_INET6, socketType == ENET_SOCKET_TYPE_DATAGRAM ? SOCK_DGRAM : SOCK_STREAM, 0);\n}\n'''
          new='''ENetSocket\nenet_socket_create (ENetAddressType addressType, ENetSocketType socketType)\n{\n#ifdef __vita__\n    if (addressType != ENET_ADDRESS_TYPE_IPV4)\n        return ENET_SOCKET_NULL;\n    return socket(PF_INET, socketType == ENET_SOCKET_TYPE_DATAGRAM ? SOCK_DGRAM : SOCK_STREAM, 0);\n#else\n    return socket(addressType == ENET_ADDRESS_TYPE_IPV4 ? PF_INET : PF_INET6, socketType == ENET_SOCKET_TYPE_DATAGRAM ? SOCK_DGRAM : SOCK_STREAM, 0);\n#endif\n}\n'''
          if old not in s: raise SystemExit('socket create anchor missing')
          p.write_text(s.replace(old,new,1))
          PY
          mkdir -p /tmp/enet6-obj "$VITASDK/arm-vita-eabi/include/enet6"
          for src in address callbacks compress host list packet peer protocol unix; do
            arm-vita-eabi-gcc -O3 -ffunction-sections -fdata-sections -D__vita__ -DHAS_SOCKLEN_T=1 -I/tmp/enet6/include -c "/tmp/enet6/src/${src}.c" -o "/tmp/enet6-obj/${src}.o"
          done
          arm-vita-eabi-ar rcs "$VITASDK/arm-vita-eabi/lib/libenet6.a" /tmp/enet6-obj/*.o
          cp -a /tmp/enet6/include/enet6/. "$VITASDK/arm-vita-eabi/include/enet6/"

      - name: Cache FFmpeg-vita
        id: cache-ffmpeg-vita
        uses: actions/cache@v4
        with:
          path: |
            /usr/local/vitasdk/arm-vita-eabi/lib/libavformat.a
            /usr/local/vitasdk/arm-vita-eabi/lib/libavcodec.a
            /usr/local/vitasdk/arm-vita-eabi/lib/libavutil.a
            /usr/local/vitasdk/arm-vita-eabi/lib/libswresample.a
            /usr/local/vitasdk/arm-vita-eabi/include/libavformat
            /usr/local/vitasdk/arm-vita-eabi/include/libavcodec
            /usr/local/vitasdk/arm-vita-eabi/include/libavutil
            /usr/local/vitasdk/arm-vita-eabi/include/libswresample
          key: ffmpeg-vita-fish47-v3

      - name: Build FFmpeg-vita
        if: steps.cache-ffmpeg-vita.outputs.cache-hit != 'true'
        run: |
          rm -rf /tmp/FFmpeg-vita
          git clone --depth 1 https://github.com/fish47/FFmpeg-vita.git /tmp/FFmpeg-vita
          cd /tmp/FFmpeg-vita
          curl -fsSL https://raw.githubusercontent.com/FFmpeg/FFmpeg/n6.0.1/libavformat/smacker.c -o libavformat/smacker.c
          curl -fsSL https://raw.githubusercontent.com/FFmpeg/FFmpeg/n6.0.1/libavcodec/smacker.c -o libavcodec/smacker.c
          ./configure --target-os=vita --enable-vita --disable-shared --disable-programs --disable-doc --disable-debug --enable-static --enable-small --prefix="$VITASDK/arm-vita-eabi" --disable-everything --enable-decoder=aac_vita,mp3_vita,aac,adpcm_ima_qt,alac,flac,mp3,opus,pcm_s16le,pcm_s24le,pcm_s32le,vorbis,smacker,smackaud --enable-demuxer=aac,mp3,mp4,m4a,matroska,flac,ogg,opus,wav,smacker --enable-muxer=null --enable-parser=aac,mpegaudio,vorbis,opus --enable-protocol=file --disable-network --disable-bzlib
          make -j$(nproc)
          make install

      - name: Install vitaGL dependencies
        run: $VITASDK/bin/vdpm vitashark mathneon

      - name: Configure Vita networking probe
        working-directory: keeperfx
        shell: bash
        run: cmake --preset vita-release 2>&1 | tee configure-network.log

      - name: Build Vita networking probe
        working-directory: keeperfx
        shell: bash
        run: |
          set +e
          cmake --build --preset vita-release > build-network.log 2>&1
          status=$?
          tail -n 600 build-network.log
          if [ "$status" -ne 0 ]; then grep -E -C 7 'undefined reference|collect2:|(^|[[:space:]])ld:|fatal error:|error:' build-network.log | tail -n 1200 || true; fi
          exit "$status"

      - name: Upload network probe logs and artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: keeperfx-vita-network-probe2
          path: |
            keeperfx/configure-network.log
            keeperfx/build-network.log
            keeperfx/out/build/vita-release/*.vpk
            keeperfx/out/build/vita-release/*.elf
            keeperfx/out/build/vita-release/keeperfx
          if-no-files-found: warn
