name: KeeperFX Vita v9 UX/Input CI

on:
  push:
    branches: [ "keeperfx-vita-v9-build" ]
  workflow_dispatch:

jobs:
  build-vita:
    name: Build KeeperFX PS Vita v9 UX/Input
    runs-on: ubuntu-24.04
    container:
      image: ghcr.io/cerwym/build-vitasdk:latest
      options: --user root

    steps:
      - name: Checkout Vita helpers
        uses: actions/checkout@v4
        with:
          ref: keeperfx-vita-v9-ux
          path: ci

      - name: Checkout KeeperFX known-good Vita commit
        uses: actions/checkout@v4
        with:
          repository: cerwym/keeperfx
          ref: 466e0753e17cee876f2ace6fa6b1e17f3ad44b0d
          fetch-depth: 1
          submodules: recursive
          path: keeperfx

      - name: Mark git directory safe
        run: git config --global --add safe.directory '*'

      - name: Install touch-first Vita controls
        working-directory: keeperfx
        run: |
          cp ../ci/keeperfx-vita/input_vita_touch.c src/input/input_vita.c
          cp ../ci/keeperfx-vita/WindowSystemVita_touch.cpp src/platform/WindowSystemVita.cpp
          python3 - <<'PY'
          from pathlib import Path
          p = Path('src/platform/WindowSystemVita.cpp')
          s = p.read_text(encoding='utf-8')
          s = s.replace('lbMouse.MMouseX', 'lbDisplay.MMouseX')
          s = s.replace('lbMouse.MMouseY', 'lbDisplay.MMouseY')
          p.write_text(s, encoding='utf-8')
          PY

      - name: Install bootstrap and v9 UX/input fixes
        working-directory: keeperfx
        run: |
          cp ../ci/keeperfx-vita/vita_bootstrap.hpp src/platform/vita_bootstrap.hpp
          python3 ../ci/keeperfx-vita/patch_bootstrap.py
          base64 -d ../ci/keeperfx-vita/v5_runtime.patch.gz.b64 | gzip -d > /tmp/keeperfx-vita-v5.patch
          patch -p1 < /tmp/keeperfx-vita-v5.patch
          python3 ../ci/keeperfx-vita/patch_v6_runtime.py
          python3 ../ci/keeperfx-vita/patch_v6_compilefix.py
          sed -i 's/loader_draw_progress(unsigned long done, unsigned long total)/loader_draw_progress(unsigned long done, unsigned long total, const char *status)/g' ../ci/keeperfx-vita/patch_v7_runtime.py
          python3 ../ci/keeperfx-vita/patch_v7_runtime.py
          python3 ../ci/keeperfx-vita/patch_v7_compilefix.py
          python3 ../ci/keeperfx-vita/patch_v8_preflight.py
          python3 ../ci/keeperfx-vita/patch_v8b_safety.py
          python3 ../ci/keeperfx-vita/patch_v8c_loader_shutdown.py
          python3 ../ci/keeperfx-vita/patch_v8d_software_ui.py
          python3 ../ci/keeperfx-vita/patch_v9_ux_controls.py

          # Preserve v8 renderer/lifecycle correctness.
          grep -q 'c.hasGPURenderPath        = 0' src/renderer/RendererVita.h
          grep -q 'c.wantsFullscreenViewport = 0' src/renderer/RendererVita.h
          grep -q 'c.hasGPUSprites           = 0' src/renderer/RendererVita.h
          grep -q 'GPU sprite intercept disabled' src/renderer/RendererManager.cpp
          grep -q 'const TbScreenCoord vita_w = 640' src/bflib_video.c
          grep -q 'const TbScreenCoord vita_h = 480' src/bflib_video.c
          grep -q 'void RendererVita::ClearScreen' src/renderer/RendererVita.cpp
          grep -q 'sceDisplayWaitVblankStart' src/platform/vita_bootstrap.hpp
          grep -q 'static void loader_shutdown' src/platform/vita_bootstrap.hpp
          grep -q 'register_sheet_software(frontend_sprite)' src/renderer/RendererManager.cpp
          grep -q 'register_sheet_software(pointer_sprites)' src/renderer/RendererManager.cpp
          grep -q 'register_sheet_software(gui_panel_sprites)' src/renderer/RendererManager.cpp
          grep -q 'register_sheet_software(button_sprites)' src/renderer/RendererManager.cpp
          grep -q 'register_sheet_software(custom_sprites)' src/renderer/RendererManager.cpp
          grep -A5 'TbScreenMode get_frontend_vidmode' src/vidmode.c | grep -q 'Lb_SCREEN_MODE_640_480_8'

          # v9 gates: loader, diagnostic overlay, progress and single-poll input.
          grep -q '.keeperfx_vita_data_v9' src/platform/vita_bootstrap.hpp
          grep -q 'never recopied between live progress repaints' src/platform/vita_bootstrap.hpp
          grep -q 'HAVE_DEBUGGER=0' build/cmake/modules/PlatformVita.cmake
          ! grep -q 'HAVE_DEBUGGER=1' build/cmake/modules/PlatformVita.cmake
          grep -q '#define VITA_SCREEN_WIDTH  640' src/input/input_vita.c
          grep -q '#define VITA_SCREEN_HEIGHT 480' src/input/input_vita.c
          grep -q 'Poll SCE controller/touch exactly once' src/platform/WindowSystemVita.cpp
          test "$(grep -R 'g_input->poll_events();' -n src/platform/WindowSystemVita.cpp src/kjm_input.c | wc -l)" -eq 1
          grep -q 'vita_startup_progress(100)' src/main.cpp
          grep -q 'local \* 52u' src/custom_sprites_cache.c
          grep -q 'extern "C" void vita_startup_progress' src/platform/vita_startup_progress.cpp

      - name: Cache FFmpeg-vita
        id: cache-ffmpeg-vita
        uses: actions/cache@v4
        with:
          path: |
            /usr/local/vitasdk/arm-vita-eabi/lib/libavformat.a
            /usr/local/vitasdk/arm-vita-eabi/lib/libavcodec.a
            /usr/local/vitasdk/arm-vita-eabi/lib/libavutil.a
            /usr/local/vitasdk/arm-vita-eabi/lib/libswresample.a
            /usr/local/vitasdk/arm-vita-eabi/include/libavformat
            /usr/local/vitasdk/arm-vita-eabi/include/libavcodec
            /usr/local/vitasdk/arm-vita-eabi/include/libavutil
            /usr/local/vitasdk/arm-vita-eabi/include/libswresample
          key: ffmpeg-vita-fish47-v3

      - name: Build FFmpeg-vita
        if: steps.cache-ffmpeg-vita.outputs.cache-hit != 'true'
        run: |
          rm -rf /tmp/FFmpeg-vita
          git clone --depth 1 https://github.com/fish47/FFmpeg-vita.git /tmp/FFmpeg-vita
          cd /tmp/FFmpeg-vita
          curl -fsSL https://raw.githubusercontent.com/FFmpeg/FFmpeg/n6.0.1/libavformat/smacker.c -o libavformat/smacker.c
          curl -fsSL https://raw.githubusercontent.com/FFmpeg/FFmpeg/n6.0.1/libavcodec/smacker.c -o libavcodec/smacker.c
          ./configure \
            --target-os=vita --enable-vita --disable-shared --disable-programs --disable-doc \
            --disable-debug --enable-static --enable-small --prefix="$VITASDK/arm-vita-eabi" \
            --disable-everything \
            --enable-decoder=aac_vita,mp3_vita,aac,adpcm_ima_qt,alac,flac,mp3,opus,pcm_s16le,pcm_s24le,pcm_s32le,vorbis,smacker,smackaud \
            --enable-demuxer=aac,mp3,mp4,m4a,matroska,flac,ogg,opus,wav,smacker \
            --enable-muxer=null --enable-parser=aac,mpegaudio,vorbis,opus \
            --enable-protocol=file --disable-network --disable-bzlib
          make -j$(nproc)
          make install

      - name: Install vitaGL dependencies
        run: $VITASDK/bin/vdpm vitashark mathneon

      - name: Configure Vita release
        working-directory: keeperfx
        run: cmake --preset vita-release

      - name: Build v9 VPK
        working-directory: keeperfx
        shell: bash
        run: |
          set +e
          cmake --build --preset vita-release > build.log 2>&1
          status=$?
          tail -n 220 build.log
          if [ "$status" -ne 0 ]; then
            echo '=== ERROR DIAGNOSTICS ==='
            grep -E -C 4 'undefined reference|collect2:|(^|[[:space:]])ld:|error:' build.log | tail -n 360 || true
          fi
          exit "$status"

      - name: Upload v9 VPK
        uses: actions/upload-artifact@v4
        with:
          name: keeperfx-vita-v9-ux-input
          path: |
            keeperfx/out/build/vita-release/*.vpk
            keeperfx/out/build/vita-release/*.elf
          if-no-files-found: error
